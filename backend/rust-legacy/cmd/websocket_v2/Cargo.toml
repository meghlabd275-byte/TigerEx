[package]
name = "tigerex-websocket-v2"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
tokio-tungstenite = "0.21"

[lib]
path = "src/lib.rs"

[[bin]]
name = "websocket_v2"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1