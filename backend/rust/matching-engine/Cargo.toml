[package]
name = "tigerex-matching-engine"
version = "1.0.0"
edition = "2021"
description = "High-performance matching engine for TigerEx"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
crossbeam = "0.8"
parking_lot = "0.12"
rayon = "1.8"
ahash = "0.8"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
bytes = "1.5"
rand = "0.8"

[[bin]]
name = "matching-engine"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true