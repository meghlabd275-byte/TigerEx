[package]
name = "tigerex-web3-wallet"
version = "1.0.0"
edition = "2021"
description = "Non-custodial multi-chain wallet with real key derivation, RPC and signing"
license = "MIT"

[dependencies]
tigerex-hdwallet = { path = "../../pkg/hdwallet" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
secp256k1 = { version = "0.28", features = ["recovery", "rand-std"] }
keccak-hash = "0.10"
rlp = "0.5"
sha3 = "0.10"
hex = "0.4"
base58 = "0.2"
rand = "0.8"
chrono = "0.4"
zeroize = { version = "1", features = ["derive"] }
ed25519-dalek = "2.1"
sha2 = "0.10"

[lib]
path = "src/lib.rs"
