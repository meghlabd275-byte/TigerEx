[package]
name = "tigerex-wallet-service"
version = "1.0.0"
edition = "2021"
authors = ["TigerEx Team"]
description = "TigerEx Wallet Service - Multi-chain HD Wallet Management"

[dependencies]
# Web server
axum = "0.7.4"
tower-http = { version = "0.5.1", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "json"] }

# Cryptography
bip39 = "2.0"
bip32 = "0.5"
slip10 = "0.4"
secp256k1 = { version = "0.28", features = ["recovery", "rand_core"] }
hex = "0.4"
base58 = "0.2"
sha2 = "0.10"
keccak-hash = "0.10"
rlp = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Blockchain RPC
reqwest = { version = "0.11", features = ["json"] }

# Cache
redis = { version = "0.25", features = ["tokio-comp"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "wallet-service"
path = "src/main.rs"
