[package]
name = "tigerex-ecosystem"
version = "1.0.0"
edition = "2021"
description = "TigerEx ecosystem integration layer: chains, tokens, DEX pools, bridges, farms"
license = "MIT"

[dependencies]
tigerex-hdwallet = { path = "../../pkg/hdwallet" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["sync", "rt"] }
tracing = "0.1"
hex = "0.4"
keccak-hash = "0.10"

[lib]
path = "src/lib.rs"
