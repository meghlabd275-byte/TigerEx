[package]
name = "tigerex-kyc"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }

[lib]
name = "tigerex_kyc"
path = "src/lib.rs"

[[bin]]
name = "kyc_aml"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
