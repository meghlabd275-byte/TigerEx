[package]
name = "tigerex-fiat-rails"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
base64 = "0.21"

[lib]
path = "src/lib.rs"

[[bin]]
name = "fiat_rails"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1