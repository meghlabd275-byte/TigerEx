[package]
name = "tigerex-kyc-service"
version = "1.0.0"
edition = "2021"
authors = ["TigerEx Team"]
description = "TigerEx KYC/AML Service - Identity Verification & Compliance"

[dependencies]
# Web server
axum = "0.7.4"
tower-http = { version = "0.5.1", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "json"] }

# Image processing
image = "0.25"
base64 = "0.22"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hashing
sha2 = "0.10"

# OCR (placeholder - in production use actual OCR service)
# In production, integrate with:
# - AWS Rekognition
# - Google Cloud Vision
# - Azure Face API
# - Onfido
# - Sumsub
# - Veriff

# Rate limiting
ratelimit = "0.9"

# Cache
redis = { version = "0.25", features = ["tokio-comp"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "kyc-service"
path = "src/main.rs"
