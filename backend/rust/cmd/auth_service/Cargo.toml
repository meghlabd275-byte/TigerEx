[package]
name = "tigerex-auth-service"
version = "1.0.0"
edition = "2021"
authors = ["TigerEx Team"]
description = "TigerEx Authentication Service - Production Ready"

[dependencies]
# Web server
axum = "0.7.4"
tower-http = { version = "0.5.1", features = ["cors", "trace", "add-extension"] }

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Cryptography
argon2 = "0.5"
jsonwebtoken = "9.2"
totp-rs = { version = "5.5", features = ["otpauth", "gen_secret"] }
rand = "0.8"
sha2 = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
[[bin]]
name = "auth-service"
path = "src/main.rs"