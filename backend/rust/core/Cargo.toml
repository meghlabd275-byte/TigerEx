[package]
name = "tigerex-core"
version = "1.0.0"
edition = "2021"
authors = ["TigerEx Team"]

[dependencies]
# High-performance serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Cryptography - AES-GCM encryption
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
x25519-dalek = "2.0"

# For key derivation
pbkdf2 = "0.12"
base64 = "0.21"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID for order IDs
uuid = { version = "1.6", features = ["v4", "serde"] }

# LRU cache for order books
lru = "0.12"

# Metrics
metrics = "0.21"

[dev-dependencies]
criterion = "0.5"