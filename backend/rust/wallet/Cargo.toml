[package]
name = "tigerex-wallet"
version = "1.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
anyhow = "1.0"
sha2 = "0.10"
ripemd160 = "0.10"
base58 = "0.2"
hex = "0.4"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true