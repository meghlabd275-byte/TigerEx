[package]
name = "tigerex-cold-wallet"
version = "1.0.0"
edition = "2021"
description = "TigerEx Cold Wallet - Ultra-secure multi-signature wallet infrastructure"
authors = ["TigerEx Security Team"]
license = "MIT"

[dependencies]
# Cryptography
ring = "0.17.8"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
sha2 = "0.10.8"
hmac = "0.12.3"
aes-gcm = "0.10.3"
chacha20poly1305 = "1.0.0"
rand = "0.8.5"
base64 = "0.22.3"
hex = "0.4.3"

# Serialization
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

# Async
tokio = { version = "1.41.0", features = ["full"] }
futures = "0.3.31"

# Database
rusqlite = { version = "0.32.1", features = ["bundled"] }

# Time
chrono = { version = "0.4.38", features = ["serde"] }

# Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing-appender = "0.2.12"

# Error handling
thiserror = "2.0.9"
anyhow = "1.0.90"

# Configuration
toml = "0.8.19"
directories = "6.0.0"

# HTTP client for blockchain nodes
reqwest = { version = "0.12.8", features = ["json", "rustls-tls"], optional = true }

[features]
default = ["runtime-async"]
runtime-async = ["tokio/rt-multi-thread"]

[dev-dependencies]
tempfile = "3.13.0"

[lib]
name = "tigerex_cold_wallet"
path = "src/lib.rs"

[[bin]]
name = "tigerex-cold-walletd"
path = "src/main.rs"