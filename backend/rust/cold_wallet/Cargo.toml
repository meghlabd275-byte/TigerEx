[package]
name = "tigerex-cold-wallet"
version = "1.0.0"
edition = "2021"
description = "TigerEx Cold Wallet - Ultra-secure multi-signature wallet infrastructure"
authors = ["TigerEx Security Team"]
license = "MIT"

[dependencies]
# Cryptography
ring = "0.17.8"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
sha2 = "0.10.8"
sha3 = "0.10.8"
ripemd = "0.1.3"
aes-gcm = "0.10.3"
rand = "0.8.5"
hex = "0.4.3"
base58 = "0.2.0"
secp256k1 = "0.28"

# Serialization
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

# Async
tokio = { version = "1.41.0", features = ["full"] }

# Time
chrono = { version = "0.4.38", features = ["serde"] }

# Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Error handling
thiserror = "2.0.9"

[features]
default = ["runtime-async"]
runtime-async = ["tokio/rt-multi-thread"]

[dev-dependencies]
tempfile = "3.13.0"

[lib]
name = "tigerex_cold_wallet"
path = "src/lib.rs"

[[bin]]
name = "tigerex-cold-walletd"
path = "src/main.rs"