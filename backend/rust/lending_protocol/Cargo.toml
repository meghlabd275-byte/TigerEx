[package]
name = "tigerex-lending"
version = "1.0.0"
edition = "2021"
description = "TigerEx Lending Protocol - Decentralized Lending/Borrowing"
authors = ["TigerEx DeFi Team"]

[dependencies]
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
rand = "0.8"

[lib]
name = "tigerex_lending"
path = "src/lib.rs"

[[bin]]
name = "tigerex-lendingd"
path = "src/main.rs"