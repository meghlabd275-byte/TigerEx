[package]
name = "tigerex-derivatives"
version = "1.0.0"
edition = "2021"
authors = ["TigerEx Team"]

[dependencies]
tigerex-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.8"
sha2 = "0.10"
