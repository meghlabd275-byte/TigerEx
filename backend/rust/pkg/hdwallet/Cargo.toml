[package]
name = "tigerex-hdwallet"
version = "1.0.0"
edition = "2021"
description = "Deterministic HD key derivation and address encoding for TigerEx custody"
license = "MIT"

[dependencies]
bip39 = { version = "2.0", features = ["rand"] }
bip32 = "0.5"
slip10 = "0.4"
secp256k1 = { version = "0.28", features = ["recovery", "rand-std"] }
ed25519-dalek = "2.1"
hmac = "0.12"
pbkdf2 = "0.12"
sha2 = "0.10"
ripemd = "0.1"
hex = "0.4"
base58 = "0.2"
base64 = "0.22"
keccak-hash = "0.10"
zeroize = { version = "1", features = ["derive"] }

[lib]
path = "src/lib.rs"
