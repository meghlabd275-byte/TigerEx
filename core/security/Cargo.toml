[package]
name = "tigerex-security"
version = "1.0.0"
edition = "2021"
description = "TigerEx Security Module - Cryptographic operations and secure storage"
authors = ["TigerEx Team"]
license = "MIT"

[dependencies]
# Cryptography
aes-gcm = "0.10"
argon2 = "0.5"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
rand = "0.8"
rsa = "0.9"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[[bench]]
name = "crypto_benches"
harness = false
