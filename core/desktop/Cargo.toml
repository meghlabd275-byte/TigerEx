// TigerEx Desktop - Tauri + Rust Backend
// Cross-platform desktop application

# Learn more about Tauri at https://tauri.app

[package]
name = "tigerex-desktop"
version = "1.0.0"
description = "TigerEx Desktop Trading Application"
authors = ["TigerEx Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6", features = ["shell-open", "window-all", "dialog-all", "global-shortcut-all", "system-tray", "clipboard-all"] }
tauri-plugin-shell = "0.2"
tauri-plugin-dialog = "0.1"
tauri-plugin-clipboard = "0.1"
tauri-plugin-fs = "0.1"
tauri-plugin-notification = "0.1"
tauri-plugin-http = "0.1"
tauri-plugin-log = "0.1"
tauri-plugin-store = "0.1"
log = "0.4"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true