name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tigerex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: backend/go/go.mod

      - name: Test backend Go module
        working-directory: backend/go
        run: go test -mod=mod . ./internal/api ./internal/wallet ./internal/perpetual ./internal/admin ./internal/trading ./services/admin ./cmd/admin_service

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: |
            TigerEx/rest_api_gateway/go.mod
            TigerEx/websocket_gateway/go.mod
            TigerEx/distributed_exchange_backend/go.mod
            TigerEx/kyc_aml/go.mod
            TigerEx/payment_integration/go.mod
            TigerEx/health_check/go.mod
            TigerEx/services/go.mod
            TigerEx/auth_service/go.mod
            TigerEx/user_wallet/go.mod
            TigerEx/user_auth/service/go.mod
            TigerEx/super_admin_and_rbac/go.mod
            TigerEx/security/go.mod
            TigerEx/blockchain_and_web3/go.mod
            TigerEx/defi_wallet/go.mod
            TigerEx/fiat_onramp/go.mod
            TigerEx/payment_gateway/go.mod

      - name: Test REST gateway internal packages
        working-directory: TigerEx/rest_api_gateway
        run: go test ./internal/...

      - name: Test WebSocket gateway packages
        working-directory: TigerEx/websocket_gateway
        run: go test ./...

      - name: Test distributed exchange backend
        working-directory: TigerEx/distributed_exchange_backend
        run: go build ./... && go vet ./... && go test ./...

      - name: Test KYC/AML service (fail-closed)
        working-directory: TigerEx/kyc_aml
        run: go vet ./... && go test ./...

      - name: Test payment integration adapters (fail-closed)
        working-directory: TigerEx/payment_integration
        run: go vet ./... && go test ./...

      - name: Build health check probes
        working-directory: TigerEx/health_check
        run: go vet ./... && go build ./...

      - name: Test admin service validation and isolation
        run: GO111MODULE=off go test ./TigerEx/admin_panel

      - name: Test shared services module (fail-closed)
        working-directory: TigerEx/services
        run: go vet ./... && go test ./...

      - name: Test unified integration layer (fail-closed)
        working-directory: integrations
        run: go vet ./... && go test ./...

      - name: Test auth service
        working-directory: TigerEx/auth_service
        run: go vet ./... && go test ./...

      - name: Test user wallet service
        working-directory: TigerEx/user_wallet
        run: go vet ./... && go test ./...

      - name: Test user auth service
        working-directory: TigerEx/user_auth/service
        run: go vet ./... && go test ./...

      - name: Test super-admin RBAC service
        working-directory: TigerEx/super_admin_and_rbac
        run: go vet ./... && go test ./...

      - name: Test security service
        working-directory: TigerEx/security
        run: go vet ./... && go test ./...

      - name: Test blockchain and web3 service
        working-directory: TigerEx/blockchain_and_web3
        run: go vet ./... && go test ./...

      - name: Test DeFi wallet service
        working-directory: TigerEx/defi_wallet
        run: go vet ./... && go test ./...

      - name: Test fiat on-ramp service
        working-directory: TigerEx/fiat_onramp
        run: go vet ./... && go test ./...

      - name: Test payment gateway service
        working-directory: TigerEx/payment_gateway
        run: go vet ./... && go test ./...

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run type-check

      - name: Run ledger logic tests
        run: npm run test:logic

  cpp-matching-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install C++ build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev \
            libcurl4-openssl-dev nlohmann-json3-dev

      - name: Configure matching engine
        run: cmake -S backend/cpp/matching_engine -B build/matching-engine -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Compile matching engine with warnings
        run: cmake --build build/matching-engine --parallel 2

      - name: Run matching engine core regression tests
        run: ctest --test-dir build/matching-engine --output-on-failure

      - name: Configure order book core and tests
        run: cmake -S backend/cpp -B build/order-book -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile order book core and tests
        run: cmake --build build/order-book --parallel 2

      - name: Run order book regression tests
        run: ctest --test-dir build/order-book --output-on-failure

      - name: Configure integration layer tests
        run: |
          cmake -S core/integrations -B build/integrations -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile integration layer
        run: cmake --build build/integrations --parallel 2

      - name: Run integration layer tests
        run: ctest --test-dir build/integrations --output-on-failure

      - name: Compile and run C++ order-book regression tests
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            TigerEx/core_exchange_engine/cpp/matching_engine_test.cpp \
            -o build/matching-engine/order-book-tests
          build/matching-engine/order-book-tests

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust security/backend crate
        run: cargo test --manifest-path backend/rust/Cargo.toml

      - name: Test Rust exchange engine crate
        run: cargo test --manifest-path TigerEx/core_exchange_engine/Cargo.toml

      - name: Test Rust custody crates fail closed
        run: |
          rustc --edition 2021 --crate-type lib --test TigerEx/mpc_wallet/src/lib.rs -o /tmp/mpc_wallet_tests && /tmp/mpc_wallet_tests
          rustc --edition 2021 --crate-type lib --test TigerEx/hardware_wallet/src/lib.rs -o /tmp/hardware_wallet_tests && /tmp/hardware_wallet_tests
          rustc --edition 2021 --crate-type lib --test TigerEx/self_custody_wallet/self_custody_wallet.rs -o /tmp/self_custody_tests && /tmp/self_custody_tests

  python-analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python layer dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/python/requirements.txt pytest

      - name: Test Python analytics / ML layer
        working-directory: backend/python
        run: python -m pytest -q

      - name: Run module self-tests
        working-directory: backend/python
        run: |
          for module in src/ml/price_prediction.py src/ml/trading_models.py src/ml/advanced_models.py \
                        src/analytics/fraud_detection.py src/analytics/backtest.py; do
            python "$module"
          done

  tigerswap-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Solidity dependencies
        working-directory: tigerswap/contracts
        run: ./install-deps.sh

      - name: Build TigerSwap contracts
        working-directory: tigerswap/contracts
        run: forge build

      - name: Run TigerSwap contract test suite
        working-directory: tigerswap/contracts
        run: forge test

  tigerswap-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tigerswap/backend/go.mod
          cache-dependency-path: tigerswap/backend/go.mod

      - name: Build TigerSwap Go backend
        working-directory: tigerswap/backend
        run: go build ./...

      - name: Test TigerSwap Go backend
        working-directory: tigerswap/backend
        run: go test ./...

      # The bots crate is a cdylib that the Go control plane links through cgo
      # behind the `rust` build tag. Build the library first, then build and test
      # the tagged packages so the bridge and the engine are exercised together,
      # not only compiled in isolation.
      - name: Setup Rust for the tagged Go control plane
        uses: dtolnay/rust-toolchain@stable

      - name: Build the Rust bots library
        working-directory: tigerswap/backend/rust
        run: cargo build --release -p tigerswap-bots

      - name: Build and test the Rust-tagged Go control plane
        working-directory: tigerswap/backend
        run: |
          go build -tags rust ./cmd/api
          go test -tags rust ./services/botengine/

  tigerswap-rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test TigerSwap Rust workspace
        working-directory: tigerswap/backend/rust
        run: cargo test

  tigerswap-cpp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install C++ build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev

      - name: Configure TigerSwap C++ engine
        run: cmake -S tigerswap/backend/cpp -B build/tigerswap-cpp -DCMAKE_BUILD_TYPE=Release

      - name: Compile TigerSwap C++ engine
        run: cmake --build build/tigerswap-cpp --parallel 2

      - name: Run TigerSwap C++ engine tests
        run: ctest --test-dir build/tigerswap-cpp --output-on-failure

  tigerswap-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest web3 eth-account

      - name: Test TigerSwap Python SDK
        working-directory: tigerswap/backend/python/sdk
        run: python -m pytest tests/ -q

      - name: Test TigerSwap Python ML models
        working-directory: tigerswap/backend/python/ml
        run: python -m pytest -q

  tigerswap-java:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and test TigerSwap Java SDK
        working-directory: tigerswap/backend/java/sdk
        run: ./build.sh

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      # Build output location is deployment-specific; CI verifies compilation above.
      # Artifact publication belongs in a deployment workflow with an explicit output directory.
