name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tigerex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: backend/go/go.mod

      - name: Test backend Go module
        working-directory: backend/go
        run: go test -mod=mod . ./internal/api ./internal/wallet ./internal/perpetual ./internal/admin ./internal/trading ./services/admin ./cmd/admin_service

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: |
            TigerEx/rest_api_gateway/go.mod
            TigerEx/websocket_gateway/go.mod
            TigerEx/distributed_exchange_backend/go.mod

      - name: Test REST gateway internal packages
        working-directory: TigerEx/rest_api_gateway
        run: go test ./internal/...

      - name: Test WebSocket gateway packages
        working-directory: TigerEx/websocket_gateway
        run: go test ./...

      - name: Test distributed exchange backend
        working-directory: TigerEx/distributed_exchange_backend
        run: go build ./... && go vet ./... && go test ./...

      - name: Test admin service validation and isolation
        run: GO111MODULE=off go test ./TigerEx/admin_panel

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run type-check

      - name: Run ledger logic tests
        run: npm run test:logic

  cpp-matching-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install C++ build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev \
            libcurl4-openssl-dev nlohmann-json3-dev

      - name: Configure matching engine
        run: cmake -S backend/cpp/matching_engine -B build/matching-engine -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Compile matching engine with warnings
        run: cmake --build build/matching-engine --parallel 2

      - name: Run matching engine core regression tests
        run: ctest --test-dir build/matching-engine --output-on-failure

      - name: Configure order book core and tests
        run: cmake -S backend/cpp -B build/order-book -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile order book core and tests
        run: cmake --build build/order-book --parallel 2

      - name: Run order book regression tests
        run: ctest --test-dir build/order-book --output-on-failure

      - name: Configure integration layer tests
        run: |
          cmake -S core/integrations -B build/integrations -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile integration layer
        run: cmake --build build/integrations --parallel 2

      - name: Run integration layer tests
        run: ctest --test-dir build/integrations --output-on-failure

      - name: Compile and run C++ order-book regression tests
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            TigerEx/core_exchange_engine/cpp/matching_engine_test.cpp \
            -o build/matching-engine/order-book-tests
          build/matching-engine/order-book-tests

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust security/backend crate
        run: cargo test --manifest-path backend/rust/Cargo.toml

      - name: Test Rust exchange engine crate
        run: cargo test --manifest-path TigerEx/core_exchange_engine/Cargo.toml

  tigerswap-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Solidity dependencies
        working-directory: tigerswap/contracts
        run: ./install-deps.sh

      - name: Build TigerSwap contracts
        working-directory: tigerswap/contracts
        run: forge build

      - name: Run TigerSwap contract test suite
        working-directory: tigerswap/contracts
        run: forge test

  tigerswap-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tigerswap/backend/go.mod
          cache-dependency-path: tigerswap/backend/go.mod

      - name: Build TigerSwap Go backend
        working-directory: tigerswap/backend
        run: go build ./...

      - name: Test TigerSwap Go backend
        working-directory: tigerswap/backend
        run: go test ./...

  tigerswap-rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test TigerSwap Rust workspace
        working-directory: tigerswap/backend/rust
        run: cargo test

  tigerswap-cpp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install C++ build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev

      - name: Configure TigerSwap C++ engine
        run: cmake -S tigerswap/backend/cpp -B build/tigerswap-cpp -DCMAKE_BUILD_TYPE=Release

      - name: Compile TigerSwap C++ engine
        run: cmake --build build/tigerswap-cpp --parallel 2

      - name: Run TigerSwap C++ engine tests
        run: ctest --test-dir build/tigerswap-cpp --output-on-failure

  tigerswap-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest web3 eth-account

      - name: Test TigerSwap Python SDK
        working-directory: tigerswap/backend/python/sdk
        run: python -m pytest tests/ -q

      - name: Test TigerSwap Python ML models
        working-directory: tigerswap/backend/python/ml
        run: python -m pytest -q

  tigerswap-java:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and test TigerSwap Java SDK
        working-directory: tigerswap/backend/java/sdk
        run: ./build.sh

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      # Build output location is deployment-specific; CI verifies compilation above.
      # Artifact publication belongs in a deployment workflow with an explicit output directory.
