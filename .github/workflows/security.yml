name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: tigerex-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - go
          - python
          - cpp
          - rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'cpp' && 'manual' || 'autobuild' }}

      - name: Install C++ build dependencies
        if: matrix.language == 'cpp'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev

      - name: Configure C++ matching engine for CodeQL
        if: matrix.language == 'cpp'
        run: cmake -S backend/cpp/matching_engine -B build/matching-engine -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build C++ matching engine for CodeQL
        if: matrix.language == 'cpp'
        run: cmake --build build/matching-engine --parallel 2

      - name: Autobuild compiled languages
        if: matrix.language != 'cpp'
        uses: github/codeql-action/autobuild@v3

      - name: Analyze source
        uses: github/codeql-action/analyze@v4

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
