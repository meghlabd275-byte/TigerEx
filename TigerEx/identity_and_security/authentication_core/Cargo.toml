[package]
name = "tigerex-auth"
version = "1.0.0"
edition = "2021"
authors = ["TigerEx Team"]
description = "TigerEx Authentication Service - Secure, Fast, Multi-factor"

[dependencies]
# TOTP/HOTP
totp-rs = { version = "5.4", features = ["gen_secret", "otpauth"] }

# JWT
jsonwebtoken = "9.2"

# Password hashing
bcrypt = "0.15"
argon2 = "0.5"

# Cryptography (OTP derivation, request signing, constant-time compare)
hmac = "0.12"
sha2 = "0.10"
subtle = "2.5"

# Authenticated encryption for secrets at rest (AES-256-GCM)
aes-gcm = "0.10"

# Passkey/WebAuthn ES256 signature verification (NIST P-256)
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["der"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
rand = "0.8"

# Logging
tracing = "0.1"

[lib]
name = "tigerex_auth"
path = "src/lib.rs"
