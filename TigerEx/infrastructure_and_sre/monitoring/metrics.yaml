# Prometheus metrics

metric "exchange_orders_total" {
  type = "counter"
  help = "Total orders processed"
}

# Grafana dashboard
dashboard "exchange-overview" {
  panels = [
    { title = "Orders/sec", type = "graph" },
    { title = "Latency", type = "graph" }
  ]
}

# Alerting rules
alert "high-latency" {
  expr = "histogram_quantile(0.99, rate(latency_bucket[5m])) > 1"
  annotations = { description = "High latency detected" }
}