[package]
name = "tigerex-crypto-operations"
version = "1.0.0"
edition = "2021"
description = "TigerEx cryptographic operations: AEAD, hashing, KDF, signatures"
license = "MIT"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22"
ed25519-dalek = { version = "2.1.0", features = ["rand_core"] }
hmac = "0.12.1"
rand = "0.8"
sha2 = "0.10.8"
subtle = "2.5"

[dev-dependencies]
hex = "0.4"
