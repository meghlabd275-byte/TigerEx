apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: tigerex
  labels:
    app: user-service
spec:
  replicas: 10
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: tigerex/user-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: tigerex-secrets
              key: jwt-secret
        - name: DB_HOST
          value: "postgres.tigerex.svc.cluster.local"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: tigerex
spec:
  clusterIP: None
  ports:
  - port: 8081
    targetPort: 8081
  selector:
    app: user-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
