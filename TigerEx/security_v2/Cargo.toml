[package]
name = "tigerex-security-v2"
version = "2.0.0"
edition = "2021"
description = "TigerEx advanced security primitives (encryption, device fingerprinting, behavioural risk)"
license = "MIT"

[dependencies]
aes-gcm = "0.10.3"
chacha20poly1305 = "0.10.1"
sha2 = "0.10.8"
argon2 = "0.5.3"
rsa = { version = "0.9.6", features = ["sha2"] }
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
