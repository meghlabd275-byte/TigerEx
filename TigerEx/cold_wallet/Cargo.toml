[package]
name = "tigerex-cold-wallet"
version = "1.0.0"
edition = "2021"
authors = ["TigerEx Team"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust-ecdsa = "0.14"
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
tracing = "0.1"
parking_lot = "0.12"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
