[package]
name = "tigerex-engine"
version = "1.0.0"
edition = "2021"
authors = ["TigerEx Team"]
description = "High-performance cryptocurrency exchange matching engine"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
rayon = "1.8"
ahash = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
rust_decimal = { version = "1.33", features = ["serde"] }
crossbeam = "0.8"
lto = true
codegen-units = 1
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
