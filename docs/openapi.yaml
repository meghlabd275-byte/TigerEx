openapi: 3.0.3
info:
  title: TigerEx API
  description: |
    TigerEx Cryptocurrency Exchange API - Production-Grade Trading Platform
    
    ## Authentication
    All endpoints require authentication via API key or JWT token. Include the following headers:
    - `X-API-Key` for API key authentication
    - `Authorization: Bearer <token>` for JWT authentication
    
    ## Rate Limits
    - Public endpoints: 1200 requests/minute
    - Trading endpoints: 600 requests/minute
    - Withdrawals: 60 requests/minute
    
    ## API Versioning
    Current version: v2. Use `Accept: application/json` header.
    
    ## Response Format
    All responses follow this structure:
    ```json
    {
      "code": 0,
      "message": "success",
      "data": { ... },
      "timestamp": 1234567890
    }
    ```
    
    ## Error Codes
    | Code | Description |
    |------|-------------|
    | 0 | Success |
    | 10001 | Invalid parameter |
    | 10002 | Missing parameter |
    | 10003 | Invalid API key |
    | 10004 | Invalid signature |
    | 10005 | Invalid timestamp |
    | 10006 | Rate limit exceeded |
    | 20001 | Insufficient balance |
    | 20002 | Order not found |
    | 20003 | Duplicate order |
    | 20004 | Market closed |
    | 20005 | Trading disabled |
    | 30001 | KYC required |
    | 30002 | Account locked |
    | 30003 | Withdrawal suspended |
    | 40001 | System error |
  version: 2.0.0
  contact:
    name: TigerEx API Support
    email: api@tigerex.com
  license:
    name: Proprietary
    url: https://tigerex.com/license

servers:
  - url: https://api.tigerex.com
    description: Production server
  - url: https://testnet.tigerex.com
    description: Testnet server

tags:
  - name: Market Data
    description: Public market data endpoints
  - name: Trading
    description: Trading and order management
  - name: Account
    description: Account and user management
  - name: Wallet
    description: Deposits, withdrawals, and transfers
  - name: Portfolio
    description: Portfolio and positions
  - name: Sub-Accounts
    description: Sub-account management
  - name: WebSocket
    description: WebSocket streams
  - name: Staking
    description: Staking and DeFi
  - name: Earn
    description: Earn products
  - name: NFT
    description: NFT trading

paths:
  # ============================================================================
  # MARKET DATA ENDPOINTS
  # ============================================================================
  
  /api/v2/exchangeInfo:
    get:
      summary: Exchange Information
      description: Get current exchange configuration including trading rules and symbol info
      operationId: getExchangeInfo
      tags:
        - Market Data
      parameters:
        - name: symbol
          in: query
          description: Trading pair symbol (e.g., BTCUSDT)
          schema:
            type: string
        - name: symbols
          in: query
          description: Comma-separated list of symbols
          schema:
            type: string
      responses:
        '200':
          description: Exchange information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
  
  /api/v2/depth:
    get:
      summary: Order Book
      description: Get order book depth for a trading pair
      operationId: getDepth
      tags:
        - Market Data
      parameters:
        - name: symbol
          in: query
          required: true
          description: Trading pair symbol
          schema:
            type: string
            example: BTCUSDT
        - name: limit
          in: query
          description: Number of levels to return (1-100)
          schema:
            type: integer
            default: 100
            maximum: 100
      responses:
        '200':
          description: Order book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBook'
  
  /api/v2/trades:
    get:
      summary: Recent Trades
      description: Get recent trades for a symbol
      operationId: getTrades
      tags:
        - Market Data
      parameters:
        - name: symbol
          in: query
          required: true
          description: Trading pair symbol
          schema:
            type: string
        - name: limit
          in: query
          description: Number of trades to return (1-1000)
          schema:
            type: integer
            default: 500
            maximum: 1000
        - name: fromId
          in: query
          description: Trade ID to start from
          schema:
            type: integer
      responses:
        '200':
          description: Trade list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'
  
  /api/v2/historicalTrades:
    get:
      summary: Historical Trades
      description: Get historical trades for a symbol (requires API key)
      operationId: getHistoricalTrades
      tags:
        - Market Data
      parameters:
        - name: symbol
          in: query
          required: true
          description: Trading pair symbol
          schema:
            type: string
        - name: limit
          in: query
          description: Number of trades to return
          schema:
            type: integer
            default: 500
            maximum: 1000
        - name: startTime
          in: query
          description: Start time in milliseconds
          schema:
            type: integer
        - name: endTime
          in: query
          description: End time in milliseconds
          schema:
            type: integer
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Historical trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoricalTrade'
  
  /api/v2/klines:
    get:
      summary: Kline/Candlestick Data
      description: Get kline/candlestick data for a symbol
      operationId: getKlines
      tags:
        - Market Data
      parameters:
        - name: symbol
          in: query
          required: true
          description: Trading pair symbol
          schema:
            type: string
        - name: interval
          in: query
          required: true
          description: Kline interval
          schema:
            type: string
            enum: [1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, 1d, 3d, 1w, 1M]
        - name: startTime
          in: query
          description: Start time in milliseconds
          schema:
            type: integer
        - name: endTime
          in: query
          description: End time in milliseconds
          schema:
            type: integer
        - name: limit
          in: query
          description: Number of klines to return
          schema:
            type: integer
            default: 500
            maximum: 1500
      responses:
        '200':
          description: Kline data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Kline'
  
  /api/v2/ticker/24hr:
    get:
      summary: 24hr Ticker
      description: Get 24hr price change statistics for a symbol or all symbols
      operationId: get24hrTicker
      tags:
        - Market Data
      parameters:
        - name: symbol
          in: query
          description: Trading pair symbol
          schema:
            type: string
        - name: symbols
          in: query
          description: Comma-separated symbols
          schema:
            type: string
      responses:
        '200':
          description: Ticker data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticker24hr'
  
  /api/v2/ticker/price:
    get:
      summary: Symbol Price Ticker
      description: Get latest price for a symbol
      operationId: getPriceTicker
      tags:
        - Market Data
      parameters:
        - name: symbol
          in: query
          required: true
          description: Trading pair symbol
          schema:
            type: string
      responses:
        '200':
          description: Price ticker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceTicker'
  
  /api/v2/ticker/bookTicker:
    get:
      summary: Book Ticker
      description: Get best price/qty on the order book
      operationId: getBookTicker
      tags:
        - Market Data
      parameters:
        - name: symbol
          in: query
          required: true
          description: Trading pair symbol
          schema:
            type: string
      responses:
        '200':
          description: Book ticker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookTicker'

  # ============================================================================
  # TRADING ENDPOINTS
  # ============================================================================
  
  /api/v2/order:
    post:
      summary: New Order
      description: |
        Place a new order. Supports LIMIT, MARKET, STOP_LOSS, STOP_LOSS_LIMIT, 
        TAKE_PROFIT, TAKE_PROFIT_LIMIT, OCO, TRAILING_STOP orders.
      operationId: newOrder
      tags:
        - Trading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrderRequest'
      security:
        - ApiKeyAuth: []
        - JWTAuth: []
      responses:
        '200':
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
    
    delete:
      summary: Cancel Order
      description: Cancel a pending order
      operationId: cancelOrder
      tags:
        - Trading
      parameters:
        - name: symbol
          in: query
          required: true
          description: Trading pair symbol
          schema:
            type: string
        - name: orderId
          in: query
          description: Order ID
          schema:
            type: integer
            format: int64
        - name: origClientOrderId
          in: query
          description: Client order ID
          schema:
            type: string
      security:
        - ApiKeyAuth: []
        - JWTAuth: []
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  
  /api/v2/order/test:
    post:
      summary: Test New Order
      description: Validate order without placing it
      operationId: testNewOrder
      tags:
        - Trading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrderRequest'
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Validation successful
  
  /api/v2/openOrders:
    get:
      summary: Current Orders
      description: Get all open orders for the account
      operationId: getOpenOrders
      tags:
        - Trading
      parameters:
        - name: symbol
          in: query
          description: Trading pair symbol
          schema:
            type: string
        - name: timestamp
          in: query
          description: Start time in milliseconds
          schema:
            type: integer
        - name: limit
          in: query
          description: Number of orders to return
          schema:
            type: integer
            default: 500
            maximum: 1000
      security:
        - ApiKeyAuth: []
        - JWTAuth: []
      responses:
        '200':
          description: Open orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  
  /api/v2/allOrders:
    get:
      summary: All Orders
      description: Get all orders (including history)
      operationId: getAllOrders
      tags:
        - Trading
      parameters:
        - name: symbol
          in: query
          required: true
          description: Trading pair symbol
          schema:
            type: string
        - name: orderId
          in: query
          description: Order ID to start from
          schema:
            type: integer
            format: int64
        - name: startTime
          in: query
          description: Start time in milliseconds
          schema:
            type: integer
        - name: endTime
          in: query
          description: End time in milliseconds
          schema:
            type: integer
        - name: limit
          in: query
          description: Number of orders to return
          schema:
            type: integer
            default: 500
            maximum: 1000
      security:
        - ApiKeyAuth: []
        - JWTAuth: []
      responses:
        '200':
          description: Order history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  
  /api/v2/myTrades:
    get:
      summary: Account Trades
      description: Get trades for the account
      operationId: getMyTrades
      tags:
        - Trading
      parameters:
        - name: symbol
          in: query
          required: true
          description: Trading pair symbol
          schema:
            type: string
        - name: orderId
          in: query
          description: Filter by order ID
          schema:
            type: integer
            format: int64
        - name: startTime
          in: query
          description: Start time in milliseconds
          schema:
            type: integer
        - name: endTime
          in: query
          description: End time in milliseconds
          schema:
            type: integer
        - name: fromId
          in: query
          description: Trade ID to start from
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          description: Number of trades to return
          schema:
            type: integer
            default: 500
            maximum: 1000
      security:
        - ApiKeyAuth: []
        - JWTAuth: []
      responses:
        '200':
          description: Trade history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'
  
  /api/v2/ocoOrder:
    post:
      summary: Place OCO Order
      description: Place One Cancels Other (OCO) order
      operationId: placeOCOOrder
      tags:
        - Trading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OCOOrderRequest'
      security:
        - ApiKeyAuth: []
        - JWTAuth: []
      responses:
        '200':
          description: OCO order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OCOResponse'
    
    delete:
      summary: Cancel OCO Order
      description: Cancel an OCO order
      operationId: cancelOCOOrder
      tags:
        - Trading
      parameters:
        - name: symbol
          in: query
          required: true
          description: Trading pair symbol
          schema:
            type: string
        - name: orderListId
          in: query
          required: true
          description: Order list ID
          schema:
            type: integer
            format: int64
      security:
        - ApiKeyAuth: []
        - JWTAuth: []
      responses:
        '200':
          description: OCO order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OCOResponse'
  
  /api/v2/myPreventedMatches:
    get:
      summary: Prevented Matches
      description: Get prevented matches due to STP
      operationId: getPreventedMatches
      tags:
        - Trading
      parameters:
        - name: symbol
          in: query
          description: Trading pair symbol
          schema:
            type: string
        - name: limit
          in: query
          description: Number of matches
          schema:
            type: integer
            default: 500
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Prevented matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreventedMatch'

  # ============================================================================
  # ACCOUNT ENDPOINTS
  # ============================================================================
  
  /api/v2/account:
    get:
      summary: Account Information
      description: Get current account information
      operationId: getAccount
      tags:
        - Account
      security:
        - ApiKeyAuth: []
        - JWTAuth: []
      responses:
        '200':
          description: Account info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
    
    put:
      summary: Update Account
      description: Update account settings
      operationId: updateAccount
      tags:
        - Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      security:
        - ApiKeyAuth: []
        - JWTAuth: []
      responses:
        '200':
          description: Account updated
  
  /api/v2/account/commission:
    get:
      summary: Commission Information
      description: Get account commission rates
      operationId: getCommission
      tags:
        - Account
      parameters:
        - name: symbol
          in: query
          description: Trading pair symbol
          schema:
            type: string
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Commission rates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commission'
  
  /api/v2/account/status:
    get:
      summary: Account Status
      description: Get detailed account status
      operationId: getAccountStatus
      tags:
        - Account
      security:
        - ApiKeyAuth: []
        - JWTAuth: []
      responses:
        '200':
          description: Account status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatus'
  
  /api/v2/apiKeys:
    get:
      summary: API Keys
      description: Get all API keys for the account
      operationId: getApiKeys
      tags:
        - Account
      security:
        - ApiKeyAuth: []
        - JWTAuth: []
      responses:
        '200':
          description: API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
    
    post:
      summary: Create API Key
      description: Create a new API key
      operationId: createApiKey
      tags:
        - Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      security:
        - ApiKeyAuth: []
        - JWTAuth: []
      responses:
        '200':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
  
  /api/v2/apiKeys/{keyId}:
    delete:
      summary: Delete API Key
      description: Delete an API key
      operationId: deleteApiKey
      tags:
        - Account
      parameters:
        - name: keyId
          in: path
          required: true
          description: API key ID
          schema:
            type: string
      security:
        - ApiKeyAuth: []
        - JWTAuth: []
      responses:
        '200':
          description: API key deleted

  # ============================================================================
  # WALLET ENDPOINTS
  # ============================================================================
  
  /api/v2/capital/deposit/address:
    get:
      summary: Deposit Address
      description: Get deposit address for a currency
      operationId: getDepositAddress
      tags:
        - Wallet
      parameters:
        - name: coin
          in: query
          required: true
          description: Currency code
          schema:
            type: string
        - name: network
          in: query
          description: Network
          schema:
            type: string
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Deposit address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositAddress'
  
  /api/v2/capital/deposit:
    get:
      summary: Deposit History
      description: Get deposit history
      operationId: getDepositHistory
      tags:
        - Wallet
      parameters:
        - name: coin
          in: query
          description: Currency code
          schema:
            type: string
        - name: startTime
          in: query
          description: Start time in milliseconds
          schema:
            type: integer
        - name: endTime
          in: query
          description: End time in milliseconds
          schema:
            type: integer
        - name: limit
          in: query
          description: Number of records
          schema:
            type: integer
            default: 1000
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Deposit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deposit'
  
  /api/v2/capital/withdraw/apply:
    post:
      summary: Withdraw
      description: Submit a withdrawal request
      operationId: withdraw
      tags:
        - Wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Withdrawal submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawResult'
  
  /api/v2/capital/withdraw/history:
    get:
      summary: Withdrawal History
      description: Get withdrawal history
      operationId: getWithdrawHistory
      tags:
        - Wallet
      parameters:
        - name: coin
          in: query
          description: Currency code
          schema:
            type: string
        - name: startTime
          in: query
          description: Start time in milliseconds
          schema:
            type: integer
        - name: endTime
          in: query
          description: End time in milliseconds
          schema:
            type: integer
        - name: limit
          in: query
          description: Number of records
          schema:
            type: integer
            default: 1000
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Withdrawal history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Withdrawal'
  
  /api/v2/capital/balance:
    get:
      summary: Account Balance
      description: Get account balances
      operationId: getBalance
      tags:
        - Wallet
      parameters:
        - name: coin
          in: query
          description: Currency code
          schema:
            type: string
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Balance'
  
  /api/v2/capital/transfer:
    post:
      summary: Internal Transfer
      description: Transfer between accounts
      operationId: transfer
      tags:
        - Wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Transfer successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
  
  /api/v2/capital/convert:
    post:
      summary: Convert
      description: Convert between currencies
      operationId: convert
      tags:
        - Wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertRequest'
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Conversion successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertResult'

  # ============================================================================
  # MARGIN ENDPOINTS
  # ============================================================================
  
  /api/v2/margin/transfer:
    post:
      summary: Margin Transfer
      description: Transfer to/from margin account
      operationId: marginTransfer
      tags:
        - Portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarginTransferRequest'
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Transfer successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
  
  /api/v2/margin/borrow:
    post:
      summary: Borrow
      description: Borrow margin
      operationId: borrow
      tags:
        - Portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BorrowRequest'
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Borrow successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowResult'
  
  /api/v2/margin/repay:
    post:
      summary: Repay
      description: Repay margin borrow
      operationId: repay
      tags:
        - Portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepayRequest'
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Repay successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepayResult'
  
  /api/v2/margin/account:
    get:
      summary: Margin Account
      description: Get margin account info
      operationId: getMarginAccount
      tags:
        - Portfolio
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Margin account info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarginAccount'
  
  /api/v2/margin/position:
    get:
      summary: Margin Position
      description: Get margin position
      operationId: getMarginPosition
      tags:
        - Portfolio
      parameters:
