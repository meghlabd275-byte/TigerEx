          in: query
          description: Stream names
          schema:
            type: string
      responses:
        '101':
          description: WebSocket connection established

# ============================================================================
# COMPONENTS
# ============================================================================

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key authentication
    JWTAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication

  schemas:
    # ============================================================================
    # REQUEST SCHEMAS
    # ============================================================================
    
    NewOrderRequest:
      type: object
      required:
        - symbol
        - side
        - type
        - quantity
      properties:
        symbol:
          type: string
          description: Trading pair symbol
          example: BTCUSDT
        side:
          type: string
          enum: [BUY, SELL]
          description: Order side
        type:
          type: string
          enum: [LIMIT, MARKET, STOP_LOSS, STOP_LOSS_LIMIT, TAKE_PROFIT, TAKE_PROFIT_LIMIT, OCO, TRAILING_STOP]
          description: Order type
        timeInForce:
          type: string
          enum: [GTC, IOC, FOK, GTX]
          description: Time in force
        quantity:
          type: number
          format: double
          description: Order quantity
        price:
          type: number
          format: double
          description: Order price
        stopPrice:
          type: number
          format: double
          description: Stop price
        icebergQty:
          type: number
          format: double
          description: Iceberg quantity
        newClientOrderId:
          type: string
          description: Client order ID
        sideEffectType:
          type: string
          enum: [NO_SIDE_EFFECT, MARGIN_BORROW, AUTO_REPAY]
          description: Side effect type
        selfTradePreventionMode:
          type: string
          enum: [EXPIRE_TAKER, EXPIRE_MAKER, EXPIRE_BOTH, NONE]
          description: STP mode
    
    OCOOrderRequest:
      type: object
      required:
        - symbol
        - side
        - quantity
        - listClientOrderId
        - price
        - stopPrice
      properties:
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        quantity:
          type: number
          format: double
        listClientOrderId:
          type: string
        price:
          type: number
          format: double
        stopPrice:
          type: number
          format: double
        stopLimitPrice:
          type: number
          format: double
        stopLimitTimeInForce:
          type: string
          enum: [GTC, IOC, FOK]
    
    AccountUpdate:
      type: object
      properties:
        autoRepayAtCancel:
          type: boolean
        spotMarginEnable:
          type: boolean
    
    CreateApiKeyRequest:
      type: object
      properties:
        label:
          type: string
        permissions:
          type: array
          items:
            type: string
            enum: [TRADE, WITHDRAW, MARGIN]
        ipWhitelist:
          type: string
    
    WithdrawRequest:
      type: object
      required:
        - coin
        - address
        - amount
      properties:
        coin:
          type: string
          description: Currency code
        address:
          type: string
          description: Withdrawal address
        addressTag:
          type: string
          description: Memo/tag (XRP, XMR, etc.)
        network:
          type: string
          description: Network
        amount:
          type: number
          format: double
          description: Amount
        fee:
          type: number
          format: double
          description: Withdrawal fee
    
    TransferRequest:
      type: object
      required:
        - asset
        - amount
        - type
      properties:
        asset:
          type: string
        amount:
          type: number
          format: double
        type:
          type: string
          enum: [INTERNAL, EXTERNAL]
        fromAccountType:
          type: string
          enum: [SPOT, MARGIN, FUTURES]
        toAccountType:
          type: string
          enum: [SPOT, MARGIN, FUTURES]
    
    ConvertRequest:
      type: object
      required:
        - fromAsset
        - toAsset
        - amount
      properties:
        fromAsset:
          type: string
        toAsset:
          type: string
        amount:
          type: number
          format: double
    
    MarginTransferRequest:
      type: object
      required:
        - asset
        - amount
        - type
      properties:
        asset:
          type: string
        amount:
          type: number
          format: double
        type:
          type: string
          enum: [SPOT_TO_MARGIN, MARGIN_TO_SPOT]
    
    BorrowRequest:
      type: object
      required:
        - asset
        - amount
      properties:
        asset:
          type: string
        amount:
          type: number
          format: double
        isIsolated:
          type: boolean
          description: Isolated margin symbol
    
    RepayRequest:
      type: object
      required:
        - asset
        - amount
      properties:
        asset:
          type: string
        amount:
          type: number
          format: double
        isIsolated:
          type: boolean
    
    FuturesTransferRequest:
      type: object
      required:
        - asset
        - amount
        - type
      properties:
        asset:
          type: string
        amount:
          type: number
          format: double
        type:
          type: string
          enum: [TO_FUTURES, FROM_FUTURES]
    
    FuturesOrderRequest:
      type: object
      required:
        - symbol
        - side
        - quantity
      properties:
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        positionSide:
          type: string
          enum: [SHORT, LONG, BOTH]
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double
        stopPrice:
          type: number
          format: double
        reduceOnly:
          type: boolean
        newOrderResponseType:
          type: string
          enum: [FULL, ACK]
        timeInForce:
          type: string
          enum: [GTC, IOC, FOK, GTX]
    
    StakeRequest:
      type: object
      required:
        - product
        - asset
        - amount
      properties:
        product:
          type: string
          enum: [STAKING, SAVING, DEFI]
        asset:
          type: string
        amount:
          type: number
          format: double
        lockPeriod:
          type: integer
          description: Lock period in days
    
    UnstakeRequest:
      type: object
      required:
        - product
        - asset
      properties:
        product:
          type: string
        asset:
          type: string
    
    SubAccountTransferRequest:
      type: object
      required:
        - toEmail
        - asset
        - amount
      properties:
        toEmail:
          type: string
        asset:
          type: string
        amount:
          type: number
          format: double

    # ============================================================================
