        - WebSocket
      parameters:
        - name: streams
          in: query
          description: Stream names (comma-separated)
          schema:
            type: string
      responses:
        '101':
          description: WebSocket connection established

  /ws/{streamType}:
    get:
      summary: Combined Streams
      description: Combined WebSocket stream
      operationId: wsCombined
      tags:
        - WebSocket
      parameters:
        - name: streamType
          in: path
          required: true
          description: Stream type
          schema:
            type: string
            enum: [all, miniTicker, ticker, kline, depth, trade]
